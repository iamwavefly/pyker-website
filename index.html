<html lang="en-NG">

    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap" />
    <meta name="theme-color" content="#6B4EFF" />
    <meta property="og:type" content="website" />

    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion");

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Pyker",

        "description": "Sell crypto for naira in minutes, then spend online with a virtual dollar card.",
        "email": "support@usepyker.com",
        "areaServed": "NG",
        "sameAs": ["https://play.google.com/store/apps/details?id=com.wavefly.pyker"]
      }
    </script>
    <!-- Without JavaScript, show content that would otherwise fade in on scroll. -->
    <noscript><style>[class*="_reveal_"] { opacity: 1 !important; transform: none !important; }</style></noscript>
    <!--app-data-->
  </head>
